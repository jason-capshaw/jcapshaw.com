ine x1="60" y1="70" x2="1340" y2="70" stroke="#302c25" stroke-width="2"/><text x="60" y="125" font-family="Noto Serif" font-size="43" fill="#e8e4dc" text-anchor="start">One set of capabilities. Many clients.</text><text x="60" y="163" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">The customer chooses the interface. The distributor governs access.</text><text x="80" y="223" font-family="Noto Sans Mono" font-size="18" fill="#c8a75e" text-anchor="start">CUSTOMER-CHOSEN CLIENTS</text><rect x="80" y="247" width="400" height="92" fill="#14120f" stroke="#302c25"/><text x="280" y="285" font-family="Noto Serif" font-size="26" fill="#e8e4dc" text-anchor="middle">AI assistant</text><text x="280" y="317" font-family="Noto Sans" font-size="18" fill="#b4aca0" text-anchor="middle">General-purpose or internal</text><line x1="280" y1="339" x2="280" y2="390" stroke="#c8a75e" stroke-width="2"/><path d="M274,381 L280,390 L286,381" fill="none" stroke="#c8a75e" stroke-width="2"/><rect x="500" y="247" width="400" height="92" fill="#14120f" stroke="#302c25"/><text x="700" y="285" font-family="Noto Serif" font-size="26" fill="#e8e4dc" text-anchor="middle">Procurement platform</text><text x="700" y="317" font-family="Noto Sans" font-size="18" fill="#b4aca0" text-anchor="middle">Existing purchasing workflow</text><line x1="700" y1="339" x2="700" y2="390" stroke="#c8a75e" stroke-width="2"/><path d="M694,381 L700,390 L706,381" fill="none" stroke="#c8a75e" stroke-width="2"/><rect x="920" y="247" width="400" height="92" fill="#14120f" stroke="#302c25"/><text x="1120" y="285" font-family="Noto Serif" font-size="26" fill="#e8e4dc" text-anchor="middle">Customer application</text><text x="1120" y="317" font-family="Noto Sans" font-size="18" fill="#b4aca0" text-anchor="middle">ERP or custom software</text><line x1="1120" y1="339" x2="1120" y2="390" stroke="#c8a75e" stroke-width="2"/><path d="M1114,381 L1120,390 L1126,381" fill="none" stroke="#c8a75e" stroke-width="2"/><rect x="80" y="395" width="1240" height="107" fill="#14120f" stroke="#c8a75e"/><text x="110" y="429" font-family="Noto Sans Mono" font-size="19" fill="#c8a75e" text-anchor="start">GOVERNED ACCESS</text><text x="110" y="465" font-family="Noto Sans" font-size="26" fill="#e8e4dc" text-anchor="start">Identity  /  authority  /  audit  /  data scope  /  human exceptions</text><text x="700" y="540" font-family="Noto Sans" font-size="22" fill="#b4aca0" text-anchor="middle">Documented APIs • MCP • UCP • PunchOut • EDI</text><text x="700" y="572" font-family="Noto Sans" font-size="20" fill="#b4aca0" text-anchor="middle">Interfaces and adapters reuse the services below.</text><line x1="700" y1="590" x2="700" y2="625" stroke="#c8a75e" stroke-width="2"/><path d="M694,616 L700,625 L706,616" fill="none" stroke="#c8a75e" stroke-width="2"/><rect x="80" y="632" width="1240" height="152" fill="#14120f" stroke="#302c25"/><text x="110" y="668" font-family="Noto Sans Mono" font-size="19" fill="#c8a75e" text-anchor="start">SHARED COMMERCE SERVICES</text><rect x="110" y="694" width="220" height="55" fill="#0a0908" stroke="#302c25"/><text x="220" y="730" font-family="Noto Serif" font-size="25" fill="#e8e4dc" text-anchor="middle">Products</text><rect x="350" y="694" width="220" height="55" fill="#0a0908" stroke="#302c25"/><text x="460" y="730" font-family="Noto Serif" font-size="25" fill="#e8e4dc" text-anchor="middle">Pricing</text><rect x="590" y="694" width="220" height="55" fill="#0a0908" stroke="#302c25"/><text x="700" y="730" font-family="Noto Serif" font-size="25" fill="#e8e4dc" text-anchor="middle">Availability</text><rect x="830" y="694" width="220" height="55" fill="#0a0908" stroke="#302c25"/><text x="940" y="730" font-family="Noto Serif" font-size="25" fill="#e8e4dc" text-anchor="middle">Quotes</text><rect x="1070" y="694" width="220" height="55" fill="#0a0908" stroke="#302c25"/><text x="1180" y="730" font-family="Noto Serif" font-size="25" fill="#e8e4dc" text-anchor="middle">Orders</text><line x1="390" y1="784" x2="390" y2="838" stroke="#c8a75e" stroke-width="2"/><path d="M384,829 L390,838 L396,829" fill="none" stroke="#c8a75e" stroke-width="2"/><line x1="1010" y1="784" x2="1010" y2="838" stroke="#c8a75e" stroke-width="2"/><path d="M1004,829 L1010,838 L1016,829" fill="none" stroke="#c8a75e" stroke-width="2"/><rect x="80" y="845" width="600" height="103" fill="#14120f" stroke="#302c25"/><text x="110" y="886" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="start">ERP / operational systems</text><text x="110" y="921" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">Contracts • stock • order acceptance</text><rect x="720" y="845" width="600" height="103" fill="#14120f" stroke="#302c25"/><text x="750" y="886" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="start">Product information / documents</text><text x="750" y="921" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">Attributes • specifications • evidence</text><text x="80" y="1004" font-family="Noto Sans" font-size="22" fill="#e8e4dc" text-anchor="start">Customer approvals remain customer-owned; submissions carry verifiable authority.</text><text x="80" y="1041" font-family="Noto Sans" font-size="20" fill="#b4aca0" text-anchor="start">UCP can operate over MCP or REST. Publishing an endpoint does not guarantee client adoption.</text><line x1="60" y1="1078" x2="1340" y2="1078" stroke="#302c25" stroke-width="2"/><text x="60" y="1117" font-family="Noto Sans" font-size="18" fill="#b4aca0" text-anchor="start">Conceptual architecture • Shared services with client-specific interfaces and adapters</text><text x="1340" y="1117" font-family="Noto Sans Mono" font-size="18" fill="#b4aca0" text-anchor="end">jcapshaw.com</text></svg>