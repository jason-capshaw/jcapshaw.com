<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030" role="img"><title>Governing a customer&apos;s agent.</title><desc>The protocol carries the request. Governance decides what happens to it.</desc><rect width="1400" height="1030" fill="#0a0908"/><text x="60" y="50" font-family="Noto Sans Mono" font-size="17" fill="#b4aca0" text-anchor="start">JASON CAPSHAW / THE MOST CONNECTED WINS</text><text x="1340" y="50" font-family="Noto Sans Mono" font-size="17" fill="#c8a75e" text-anchor="end">FIG. 03</text><line x1="60" y1="70" x2="1340" y2="70" stroke="#302c25" stroke-width="2"/><text x="60" y="125" font-family="Noto Serif" font-size="43" fill="#e8e4dc" text-anchor="start">Governing a customer's agent.</text><text x="60" y="163" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">The protocol carries the request. Governance decides what happens to it.</text><rect x="90" y="380" width="200" height="135" fill="#0a0908" stroke="#302c25" stroke-width="2"/><text x="190" y="440" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="middle">Customer's</text><text x="190" y="475" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="middle">agent</text><line x1="290" y1="447" x2="350" y2="447" stroke="#c8a75e" stroke-width="2"/><path d="M340,439 L352,447 L340,455" fill="none" stroke="#c8a75e" stroke-width="2"/><rect x="360" y="215" width="480" height="135" fill="#14120f" stroke="#c8a75e" stroke-width="2"/><text x="385" y="253" font-family="Noto Sans Mono" font-size="18" fill="#c8a75e" text-anchor="start">IDENTITY</text><text x="385" y="293" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="start">Which buyer, which customer?</text><text x="385" y="327" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">Contract and ship-to, not a shared key.</text><line x1="840" y1="282" x2="865" y2="282" stroke="#c8a75e" stroke-width="2"/><rect x="360" y="380" width="480" height="135" fill="#14120f" stroke="#c8a75e" stroke-width="2"/><text x="385" y="418" font-family="Noto Sans Mono" font-size="18" fill="#c8a75e" text-anchor="start">AUTHORITY</text><text x="385" y="458" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="start">Read, prepare, or submit?</text><text x="385" y="492" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">Approval policy stays the customer's.</text><line x1="840" y1="447" x2="865" y2="447" stroke="#c8a75e" stroke-width="2"/><rect x="360" y="545" width="480" height="135" fill="#14120f" stroke="#c8a75e" stroke-width="2"/><text x="385" y="583" font-family="Noto Sans Mono" font-size="18" fill="#c8a75e" text-anchor="start">EXPOSURE</text><text x="385" y="623" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="start">Scoped, customer-initiated</text><text x="385" y="657" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">Sharing pricing is a contract question.</text><line x1="840" y1="612" x2="865" y2="612" stroke="#c8a75e" stroke-width="2"/><line x1="865" y1="282" x2="865" y2="612" stroke="#c8a75e" stroke-width="2"/><line x1="865" y1="375" x2="991" y2="375" stroke="#c8a75e" stroke-width="2"/><path d="M981,367 L993,375 L981,383" fill="none" stroke="#c8a75e" stroke-width="2"/><text x="929" y="362" font-family="Noto Sans Mono" font-size="15" fill="#b4aca0" text-anchor="middle">~95% ROUTINE</text><rect x="995" y="300" width="315" height="150" fill="#14120f" stroke="#302c25" stroke-width="2"/><text x="1020" y="340" font-family="Noto Sans Mono" font-size="18" fill="#c8a75e" text-anchor="start">SHARED SERVICES</text><text x="1020" y="382" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="start">Commerce services</text><text x="1020" y="418" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">Pricing • stock • orders</text><line x1="865" y1="575" x2="991" y2="575" stroke="#c8a75e" stroke-width="2" stroke-dasharray="8 6"/><path d="M981,567 L993,575 L981,583" fill="none" stroke="#c8a75e" stroke-width="2"/><text x="929" y="562" font-family="Noto Sans Mono" font-size="15" fill="#b4aca0" text-anchor="middle">~5% UNCERTAIN</text><rect x="995" y="500" width="315" height="150" fill="#14120f" stroke="#302c25" stroke-width="2" stroke-dasharray="8 6"/><text x="1020" y="540" font-family="Noto Sans Mono" font-size="18" fill="#c8a75e" text-anchor="start">EXCEPTIONS</text><text x="1020" y="582" font-family="Noto Serif" font-size="28" fill="#e8e4dc" text-anchor="start">Routed to a person</text><text x="1020" y="618" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">Who knows the account</text><rect x="90" y="715" width="1220" height="125" fill="#14120f" stroke="#c8a75e" stroke-width="2" stroke-dasharray="8 6"/><text x="115" y="755" font-family="Noto Sans Mono" font-size="18" fill="#c8a75e" text-anchor="start">AUDIT AND LIABILITY</text><text x="115" y="793" font-family="Noto Sans" font-size="24" fill="#e8e4dc" text-anchor="start">What was requested, what came back, what was approved, and what happened.</text><text x="115" y="824" font-family="Noto Sans" font-size="21" fill="#b4aca0" text-anchor="start">Kept in a form both parties can inspect.</text><text x="90" y="895" font-family="Noto Sans" font-size="24" fill="#e8e4dc" text-anchor="start">None of this is new. It's the discipline EDI and PunchOut already demanded.</text><line x1="60" y1="945" x2="1340" y2="945" stroke="#302c25" stroke-width="2"/><text x="60" y="990" font-family="Noto Sans" font-size="18" fill="#b4aca0" text-anchor="start">Conceptual model • Every client passes the same checks, AI or not</text><text x="1340" y="990" font-family="Noto Sans Mono" font-size="18" fill="#b4aca0" text-anchor="end">jcapshaw.com</text></svg>