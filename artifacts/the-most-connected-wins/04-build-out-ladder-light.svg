d capability. Increase control.</text><text x="60" y="163" font-family="Noto Sans" font-size="21" fill="#62594c" text-anchor="start">A permissions ladder for customer-controlled software</text><rect x="305" y="235" width="1015" height="137" fill="#faf7f1" stroke="#896719"/><text x="330" y="280" font-family="Noto Sans Mono" font-size="29" fill="#896719" text-anchor="start">04</text><text x="400" y="273" font-family="Noto Sans Mono" font-size="18" fill="#896719" text-anchor="start">COMMIT</text><text x="400" y="312" font-family="Noto Serif" font-size="28" fill="#1a1918" text-anchor="start">Submit approved repeat orders</text><text x="400" y="347" font-family="Noto Sans" font-size="21" fill="#62594c" text-anchor="start">Recheck price, availability, and authority.</text><rect x="250" y="405" width="1070" height="137" fill="#faf7f1" stroke="#ddd5c7"/><text x="275" y="450" font-family="Noto Sans Mono" font-size="29" fill="#896719" text-anchor="start">03</text><text x="345" y="443" font-family="Noto Sans Mono" font-size="18" fill="#896719" text-anchor="start">PREPARE</text><text x="345" y="482" font-family="Noto Serif" font-size="28" fill="#1a1918" text-anchor="start">Draft quotes and orders</text><text x="345" y="517" font-family="Noto Sans" font-size="21" fill="#62594c" text-anchor="start">A person reviews before submission.</text><rect x="195" y="575" width="1125" height="137" fill="#faf7f1" stroke="#ddd5c7"/><text x="220" y="620" font-family="Noto Sans Mono" font-size="29" fill="#896719" text-anchor="start">02</text><text x="290" y="613" font-family="Noto Sans Mono" font-size="18" fill="#896719" text-anchor="start">READ ACCOUNT DATA</text><text x="290" y="652" font-family="Noto Serif" font-size="28" fill="#1a1918" text-anchor="start">Price, availability by ship-to, invoices</text><text x="290" y="687" font-family="Noto Sans" font-size="21" fill="#62594c" text-anchor="start">Authenticate and scope access to the account.</text><rect x="140" y="745" width="1180" height="137" fill="#faf7f1" stroke="#ddd5c7"/><text x="165" y="790" font-family="Noto Sans Mono" font-size="29" fill="#896719" text-anchor="start">01</text><text x="235" y="783" font-family="Noto Sans Mono" font-size="18" fill="#896719" text-anchor="start">READ PUBLIC DATA</text><text x="235" y="822" font-family="Noto Serif" font-size="28" fill="#1a1918" text-anchor="start">Products, attributes, documents, relationships</text><text x="235" y="857" font-family="Noto Sans" font-size="21" fill="#62594c" text-anchor="start">Provide sources, units, and known limitations.</text><line x1="95" y1="883" x2="95" y2="249" stroke="#896719" stroke-width="2"/><path d="M87,260 L95,248 L103,260" fill="none" stroke="#896719" stroke-width="2"/><text x="140" y="960" font-family="Noto Sans" font-size="24" fill="#1a1918" text-anchor="start">Pilot one customer and one recurring workflow. Expand when it proves reliable.</text><line x1="60" y1="1018" x2="1340" y2="1018" stroke="#ddd5c7" stroke-width="2"/><text x="60" y="1057" font-family="Noto Sans" font-size="18" fill="#62594c" text-anchor="start">Conceptual sequence • Select the first pilot around customer value and risk</text><text x="1340" y="1057" font-family="Noto Sans Mono" font-size="18" fill="#62594c" text-anchor="end">jcapshaw.com</text></svg>